spring.application.name=interntrack

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/interntrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080

jwt.secret=${JWT_SECRET:InternTrackSuperSecretKeyForJwtAuthentication2026Secure}
jwt.expiration=${JWT_EXPIRATION:86400000}